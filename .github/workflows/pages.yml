name: Dashboard (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "data/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assembler le site
        run: |
          mkdir -p _site/data
          cp dashboard/index.html _site/index.html
          cp dashboard/og.png _site/og.png
          cp data/*.csv _site/data/
          cp data/changements.xml data/resumes.json _site/data/ 2>/dev/null || true

      - name: Baker le résumé du mois dans la page (SEO)
        # Le résumé du dernier mois remplace le placeholder RESUME_SEO :
        # le texte est présent dans le HTML servi, pas seulement injecté en JS.
        run: |
          python3 - <<'EOF'
          import json, html, pathlib
          site = pathlib.Path("_site/index.html")
          res = pathlib.Path("data/resumes.json")
          if res.exists():
              resumes = json.loads(res.read_text(encoding="utf-8"))["resumes"]
              if resumes:
                  dernier = resumes[max(resumes)]
                  site.write_text(site.read_text(encoding="utf-8").replace(
                      "<!--RESUME_SEO-->", html.escape(dernier)),
                      encoding="utf-8")
                  print("Résumé baké :", dernier[:80], "…")
          EOF

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
