name: Backfill archives (web.archive.org)

on:
  schedule:
    # le 15 de chaque mois à 03:00 UTC — heures creuses pour archive.org,
    # et loin du relevé mensuel du 2. Rattrape les mois d'archives manqués
    # (503 de l'API CDX, captures apparues depuis).
    - cron: "0 3 15 * *"
  workflow_dispatch:
    inputs:
      from:
        description: "Premier mois à reconstruire (YYYY-MM)"
        default: "2022-01"
      refetch:
        description: "Re-traiter aussi les mois d'archives déjà en base (parsers d'époque)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # redéploie le dashboard si des mois ont été ajoutés

concurrency:
  group: barometre     # jamais en même temps que le relevé mensuel
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # l'API CDX est très rate-limitée (backoff long)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dépendances
        # pas de Playwright : le backfill ne parse que les pages rendues
        # serveur des captures d'archives.
        run: pip install requests beautifulsoup4

      - name: Backfill
        env:
          FROM: ${{ inputs.from || '2022-01' }}
        run: |
          python barometre.py backfill --from "$FROM" --write ${{ inputs.refetch && '--refetch' || '' }} | tee backfill-output.txt

      - name: Commit des données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun mois reconstitué — rien à committer."
            exit 0
          fi
          git commit -m "Backfill archives $(date -u +%Y-%m-%d)"
          git push

      - name: Redéployer le dashboard
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main || echo "Pages non déployé (workflow absent ?)"

      - name: Résumé
        if: always()
        run: |
          {
            echo "## Backfill archives $(date -u +%Y-%m-%d)"
            echo '```'
            tail -60 backfill-output.txt 2>/dev/null || echo "(pas de sortie)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
