name: Baromètre télécoms Maroc

on:
  schedule:
    # le 2 de chaque mois à 07:00 UTC (08:00 au Maroc) —
    # on laisse passer les changements de grille du 1er.
    - cron: "0 7 2 * *"
  workflow_dispatch:
    inputs:
      no_js:
        description: "Sauter les pages Playwright (run rapide, HTML uniquement)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # déclenche le redéploiement du dashboard après le commit

concurrency:
  group: barometre
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dépendances
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Parsers (hors ligne)
        run: python barometre.py test

      - name: Joignabilité des sources
        # Non bloquant : le rapport suffit, `run` échouera de lui-même si
        # aucune source ne répond.
        run: python barometre.py check || true

      - name: Relevé du mois
        run: |
          python barometre.py run ${{ inputs.no_js && '--no-js' || '' }} | tee run-output.txt

      - name: Commit des données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement de données à committer."
            exit 0
          fi
          git commit -m "Relevé baromètre $(date -u +%Y-%m)"
          git push

      - name: Redéployer le dashboard
        # Un push fait avec GITHUB_TOKEN ne déclenche pas les workflows en
        # aval (garde anti-récursion GitHub) : on dispatche explicitement.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main || echo "Pages non déployé (workflow absent ?)"

      - name: Résumé
        if: always()
        run: |
          {
            echo "## Baromètre $(date -u +%Y-%m)"
            echo '```'
            cat run-output.txt 2>/dev/null || echo "(pas de sortie de run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
